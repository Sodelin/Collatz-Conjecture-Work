name: Lean source verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Lean release
        run: |
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.33.1'
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/lean.tar.zst" \
            https://github.com/leanprover/lean4/releases/download/v4.33.1/lean-4.33.1-linux.tar.zst
          echo "890afd185370f85666025b883914ab4f4b339136f8c96167b69cfb62aecaf235  $RUNNER_TEMP/lean.tar.zst" | sha256sum --check
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.33.1-linux/bin" >> "$GITHUB_PATH"
      - name: Build source and check theorem type and axiom report
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          lake build
          lake env lean lean/CollatzWork/Disproof/TwoPumpDependency.lean
          lake env lean lean/CollatzWork/FinitePaletteObstruction.lean | tee "$RUNNER_TEMP/palette-axioms.txt"
          if grep -q 'sorryAx' "$RUNNER_TEMP/palette-axioms.txt"; then exit 1; fi
