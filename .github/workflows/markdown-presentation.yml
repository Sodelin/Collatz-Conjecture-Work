name: Markdown presentation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Markdown math and false controls
        run: python -B verification/check_markdown_math.py --self-test
      - name: Portable note graph
        run: python -B verification/check_note_graph.py
