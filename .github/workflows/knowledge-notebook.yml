name: Knowledge notebook

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Checker false controls
        run: python -B knowledge/tools/build_index.py --self-test --check
      - name: Optimized-mode validation
        run: python -O -B knowledge/tools/build_index.py --check
